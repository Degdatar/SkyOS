<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; color: #eee7d8; background: #111513; font: 14px/1.55 "Segoe UI", sans-serif; }
    .skyos-module { overflow: hidden; border: 1px solid #977344; border-radius: 10px; background: radial-gradient(ellipse at 84% 15%, #24434a66, transparent 42%), linear-gradient(135deg, #171b18, #101411 72%); box-shadow: 0 12px 34px #0007, inset 0 1px #fff1; }
    .hero { display: grid; grid-template-columns: minmax(250px, 40%) minmax(0, 1fr); align-items: stretch; min-height: 280px; border-bottom: 1px solid #98754388; }
    .art { position: relative; min-width: 0; overflow: hidden; background: #0b100f; }
    .art img { display: block; width: 100%; height: 100%; min-height: 280px; object-fit: cover; object-position: center; filter: saturate(.88) contrast(1.06); }
    .art::after { position: absolute; inset: 0; content: ""; background: linear-gradient(90deg, transparent 60%, #111513 100%), linear-gradient(0deg, #11151355, transparent 42%); pointer-events: none; }
    .hero-copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(22px, 4vw, 54px); }
    .sigil { display: block; width: 54px; height: 54px; margin-bottom: 12px; object-fit: contain; filter: drop-shadow(0 0 14px #48c5d744); }
    .eyebrow { margin: 0 0 8px; color: #dfb76e; font: 10px/1.4 Consolas, monospace; letter-spacing: .2em; text-transform: uppercase; }
    h2 { margin: 0; color: #f4ead7; font: 700 clamp(25px, 3vw, 38px)/1.05 Georgia, serif; letter-spacing: .02em; }
    .tagline { max-width: 440px; margin: 12px 0 0; color: #b7b8ad; font-size: 13px; }
    .readout { display: flex; align-items: center; gap: 9px; margin-top: 24px; color: #77cbd3; font: 10px Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    .readout::before { width: 7px; height: 7px; border-radius: 50%; content: ""; background: #70d8c4; box-shadow: 0 0 10px #70d8c4; }
    .guide { display: flex; align-items: center; gap: 13px; padding: 15px 20px; color: #b8b7ad; font-size: 11px; }
    .guide-mark { color: #e3b461; font-size: 16px; }
    @media (max-width: 680px) { .hero { grid-template-columns: 1fr; } .art img { height: auto; min-height: 0; aspect-ratio: 1.375; } .art::after { background: linear-gradient(0deg, #11151366, transparent 45%); } .hero-copy { padding: 22px; } }
  </style>
</head>
<body>
  <section class="skyos-module" aria-label="SkyOS Dwemer workstation">
    <header class="hero">
      <div class="art"><img src="skyos-header.jpg" alt="SkyOS Dwemer interface"></div>
      <div class="hero-copy">
        <img class="sigil" src="skyos-logo.png" alt="SkyOS logo">
        <p class="eyebrow">SkyOS · Core module</p>
        <h2>SkyOS</h2>
        <p class="tagline">A Dwemer control matrix for the tools and systems that shape your world. Tune your access keys, launch experience, and browser behavior below.</p>
        <div class="readout">SkyOS Online</div>
      </div>
    </header>
    <div class="guide"><span class="guide-mark" aria-hidden="true">⟡</span><span>System controls · Select a control below to recalibrate it.</span></div>
  </section>
</body>
</html>
